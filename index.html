    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      // Syswin manages its own theme, so leave /syswin alone.
      (function () {
        try {
          if (location.pathname.indexOf('/syswin') === 0) return;
          var saved = localStorage.getItem('pf-theme');
          var dark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
